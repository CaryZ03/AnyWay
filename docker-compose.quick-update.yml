version: '3.8'

# 快速更新配置 - 使用卷挂载，无需重新安装依赖
# 使用方法: docker compose -f docker-compose.quick-update.yml up -d

services:
  # Django后端 - 使用卷挂载代码，无需重新构建
  backend:
    # 使用现有的后端镜像（如果不存在会自动构建）
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiagent-backend
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=aiagent
      - DB_USER=aiagent
      - DB_PASSWORD=${MYSQL_PASSWORD:-aiagent_password}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_API_BASE=${ARK_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
    volumes:
      # 挂载代码目录（代码更改立即生效）
      - ./backend:/app
      # 排除不需要挂载的目录（使用已安装的依赖）
      - backend_venv:/app/venv
      - backend_pycache:/app/**/__pycache__
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aiagent-network
    command: >
      sh -c "python manage.py migrate --fake-initial &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - aiagent.wsgi:application --reload"

  # Celery Worker - 同样使用卷挂载
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiagent-celery-worker
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=aiagent
      - DB_USER=aiagent
      - DB_PASSWORD=${MYSQL_PASSWORD:-aiagent_password}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_API_BASE=${ARK_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
    volumes:
      - ./backend:/app
      - backend_venv:/app/venv
      - backend_pycache:/app/**/__pycache__
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
    depends_on:
      - mysql
      - redis
      - backend
    restart: unless-stopped
    networks:
      - aiagent-network
    command: celery -A aiagent worker -l info

  # Vue前端 - 在宿主机构建，挂载构建产物
  frontend:
    image: nginx:alpine
    container_name: aiagent-frontend
    ports:
      - "18080:80"
    volumes:
      # 挂载宿主机构建的 dist 目录
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aiagent-network

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: aiagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: aiagent
      MYSQL_USER: aiagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aiagent_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aiagent-network

  # Redis缓存
  redis:
    image: redis:alpine
    container_name: aiagent-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aiagent-network

volumes:
  mysql_data:
  redis_data:
  # 用于存储 Python 虚拟环境和缓存
  backend_venv:
  backend_pycache:

networks:
  aiagent-network:
    driver: bridge

